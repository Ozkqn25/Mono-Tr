<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monopoly Türkiye</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
:root {
  --bg: #0a1628;
  --surface: #112240;
  --surface2: #1a3560;
  --border: #2a4a7a;
  --text: #e8f0fe;
  --text2: #8aacdc;
  --gold: #f0b429;
  --red: #e53e3e;
  --green: #38a169;
  --accent: #4299e1;
  --radius: 12px;
  --brown: #8B4513; --lblue: #87CEEB; --pink: #FF69B4;
  --orange: #FF8C00; --red-prop: #DC143C; --yellow: #FFD700;
  --green-prop: #228B22; --dblue: #00008B;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }

/* ── SCREENS ── */
.screen { display: none; min-height: 100vh; padding: 16px; }
.screen.active { display: flex; flex-direction: column; }

/* ── LOBBY ── */
#lobby { align-items: center; justify-content: center; gap: 20px; }
.logo { text-align: center; }
.logo h1 { font-size: 2.4rem; font-weight: 900; background: linear-gradient(135deg, var(--gold), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
.logo p { color: var(--text2); font-size: 0.9rem; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 400px; }
.card h2 { font-size: 1rem; color: var(--text2); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text); font-size: 1rem; outline: none; transition: border-color .2s; }
input:focus { border-color: var(--accent); }
input::placeholder { color: var(--text2); }
.btn { width: 100%; background: var(--accent); border: none; border-radius: 8px; padding: 13px; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity .2s, transform .1s; margin-top: 10px; }
.btn:active { transform: scale(.97); }
.btn.secondary { background: var(--surface2); color: var(--text); }
.btn.danger { background: var(--red); }
.btn.success { background: var(--green); }
.btn.gold { background: var(--gold); color: #000; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--text2); font-size: .8rem; margin: 4px 0; }
.divider::before, .divider::after { content:''; flex:1; height:1px; background: var(--border); }

/* ── WAITING ROOM ── */
#waiting { gap: 16px; }
.room-code { background: linear-gradient(135deg, var(--surface2), var(--surface)); border: 2px solid var(--gold); border-radius: var(--radius); padding: 20px; text-align: center; }
.room-code .code { font-size: 2.5rem; font-weight: 900; letter-spacing: 8px; color: var(--gold); }
.room-code p { color: var(--text2); font-size: .85rem; margin-top: 6px; }
.player-list { display: flex; flex-direction: column; gap: 8px; }
.player-item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.player-token { font-size: 1.8rem; }
.player-info .name { font-weight: 700; }
.player-info .status { color: var(--text2); font-size: .8rem; }
.badge { background: var(--gold); color: #000; font-size: .65rem; font-weight: 700; padding: 2px 6px; border-radius: 99px; margin-left: 6px; }

/* ── GAME SCREEN ── */
#game { padding: 0; display: flex; flex-direction: column; height: 100vh; gap: 0; }
.game-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.game-header .room-tag { background: var(--surface2); border-radius: 6px; padding: 3px 8px; font-size: .75rem; color: var(--text2); font-weight: 600; }
.turn-info { flex: 1; text-align: center; font-size: .85rem; font-weight: 600; }
.free-parking { font-size: .75rem; color: var(--gold); }

/* BOARD */
.board-wrap { flex: 0 0 auto; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #071020; padding: 4px; }
.board { display: grid; grid-template-columns: 52px repeat(9, 1fr) 52px; grid-template-rows: 52px repeat(9, 1fr) 52px; width: 100%; max-width: 420px; aspect-ratio: 1; background: #0e6b35; border: 2px solid #0d5429; }

.sq { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.12); font-size: .38rem; cursor: pointer; position: relative; overflow: hidden; transition: filter .15s; }
.sq:active { filter: brightness(1.3); }
.sq .sq-name { text-align: center; line-height: 1.15; color: #fff; font-weight: 600; padding: 1px; word-break: break-word; }
.sq .sq-price { color: #adf; font-size: .32rem; }
.sq .color-bar { width: 100%; height: 6px; flex-shrink: 0; }
.sq.corner { background: #0a4a25; font-size: .55rem; }
.sq.corner .sq-name { font-size: .48rem; font-weight: 900; }
.sq.chance { background: #4a3200; }
.sq.chest { background: #2a2a60; }
.sq.tax { background: #3a0a0a; }
.sq.station { background: #1a1a1a; }
.sq.utility { background: #103a10; }
.sq.bottom { flex-direction: column-reverse; }
.sq.left { flex-direction: row; writing-mode: vertical-rl; transform: rotate(180deg); }
.sq.right { flex-direction: row-reverse; writing-mode: vertical-rl; }
.sq.top { flex-direction: column; }

/* Token dots on board */
.token-dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; z-index: 5; }

/* Color bars */
.color-brown { background: var(--brown); }
.color-lblue { background: var(--lblue); }
.color-pink { background: var(--pink); }
.color-orange { background: var(--orange); }
.color-red { background: var(--red-prop); }
.color-yellow { background: var(--yellow); }
.color-green { background: var(--green-prop); }
.color-dblue { background: var(--dblue); }

/* Houses on board */
.houses-wrap { display: flex; gap: 1px; flex-wrap: wrap; justify-content: center; }
.house-dot { width: 5px; height: 5px; background: #00ff00; border-radius: 1px; }
.hotel-dot { width: 7px; height: 5px; background: #ff4444; border-radius: 1px; }

/* GAME BOTTOM PANEL */
.game-panel { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0; }

/* Player status bar */
.player-bar { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; gap: 8px; overflow-x: auto; flex-shrink: 0; }
.player-card { background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 6px 10px; min-width: 80px; text-align: center; flex-shrink: 0; transition: border-color .2s; }
.player-card.active-turn { border-color: var(--gold); box-shadow: 0 0 8px rgba(240,180,41,.3); }
.player-card.bankrupt { opacity: .4; }
.player-card .p-token { font-size: 1.2rem; }
.player-card .p-name { font-size: .65rem; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; }
.player-card .p-money { font-size: .85rem; font-weight: 700; color: var(--gold); }
.player-card .p-pos { font-size: .55rem; color: var(--text2); }

/* Action area */
.action-area { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.dice-display { display: flex; align-items: center; justify-content: center; gap: 12px; }
.die { width: 52px; height: 52px; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 4px 12px rgba(0,0,0,.5); transition: transform .3s; color: #000; }
.die.rolling { animation: roll .4s ease; }
@keyframes roll { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-15deg)} 75%{transform:rotate(15deg)} }
.dice-total { font-size: 1.5rem; font-weight: 900; color: var(--gold); }

.action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.action-buttons .btn { margin: 0; font-size: .85rem; padding: 10px; }
.action-buttons .btn.full { grid-column: 1/-1; }

/* Notification */
.notif { background: var(--surface2); border-left: 3px solid var(--gold); border-radius: 8px; padding: 10px 14px; font-size: .85rem; }
.notif.buy { border-color: var(--green); }
.notif.rent { border-color: var(--red); }
.notif.card { border-color: var(--accent); }

/* Log */
.log-area { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
.log-item { background: var(--surface); border-radius: 6px; padding: 6px 10px; font-size: .78rem; display: flex; gap: 8px; }
.log-item .log-time { color: var(--text2); flex-shrink: 0; font-size: .7rem; }

/* Property detail modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; display: none; align-items: flex-end; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-height: 70vh; overflow-y: auto; }
.modal h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 12px; }
.rent-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
.rent-table td, .rent-table th { padding: 5px 8px; border: 1px solid var(--border); }
.rent-table th { background: var(--surface2); color: var(--text2); }
.modal-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1; min-width: 100px; margin: 0; font-size: .85rem; padding: 10px; }

/* Winner overlay */
.winner-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 200; display: flex; align-items: center; justify-content: center; display: none; }
.winner-overlay.open { display: flex; }
.winner-box { background: var(--surface); border: 2px solid var(--gold); border-radius: 16px; padding: 32px 24px; text-align: center; max-width: 300px; }
.winner-box .trophy { font-size: 4rem; }
.winner-box h2 { font-size: 1.4rem; font-weight: 900; color: var(--gold); margin: 12px 0 6px; }

/* Toast */
.toast { position: fixed; top: env(safe-area-inset-top, 0px); left: 50%; transform: translateX(-50%) translateY(-80px); background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: .85rem; z-index: 300; transition: transform .3s; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(12px); }

@media (max-width: 380px) {
  .board { max-width: 340px; }
  .sq { font-size: .3rem; }
  .sq.corner .sq-name { font-size: .38rem; }
}
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby" class="screen active">
  <div class="logo">
    <h1>🏦 Monopoly</h1>
    <p>Türkiye Özel Baskı</p>
  </div>
  <div class="card">
    <h2>Adın</h2>
    <input id="nameInput" type="text" placeholder="Oyuncu adı..." maxlength="14">
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px;">
    <button class="btn gold" onclick="createRoom()">🏠 Yeni Oda Oluştur</button>
    <div class="divider">VEYA</div>
    <input id="roomInput" type="text" placeholder="Oda kodu (5 harf)" maxlength="5" style="text-transform:uppercase;">
    <button class="btn secondary" onclick="joinRoom()">🚪 Odaya Katıl</button>
  </div>
</div>

<!-- WAITING -->
<div id="waiting" class="screen">
  <div class="room-code">
    <div style="font-size:.8rem;color:var(--text2);margin-bottom:4px;">ODA KODU</div>
    <div class="code" id="waitingCode"></div>
    <p>Arkadaşlarına bu kodu ver!</p>
  </div>
  <div class="card">
    <h2>Oyuncular (<span id="playerCount">0</span>/6)</h2>
    <div id="playerList" class="player-list"></div>
  </div>
  <button class="btn gold" id="startBtn" onclick="startGame()" disabled>🎮 Oyunu Başlat</button>
  <button class="btn secondary" onclick="leaveGame()">↩ Çık</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="game-header">
    <span class="room-tag" id="gameRoomTag"></span>
    <div class="turn-info" id="turnInfo"></div>
    <div class="free-parking" id="freeParkingInfo"></div>
  </div>

  <!-- BOARD -->
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <!-- PLAYER SCROLLBAR -->
  <div class="player-bar" id="playerBar"></div>

  <!-- GAME PANEL -->
  <div class="game-panel">
    <!-- DICE + ACTIONS -->
    <div class="action-area">
      <div class="dice-display" id="diceDisplay" style="display:none">
        <div class="die" id="die1">⚀</div>
        <div class="dice-total" id="diceTotal"></div>
        <div class="die" id="die2">⚀</div>
      </div>
      <div id="notifArea"></div>
      <div class="action-buttons" id="actionButtons"></div>
    </div>

    <!-- LOG -->
    <div class="log-area" id="logArea"></div>
  </div>
</div>

<!-- PROPERTY MODAL -->
<div class="modal-overlay" id="propModal" onclick="closePropModal(event)">
  <div class="modal" id="propModalContent"></div>
</div>

<!-- WINNER -->
<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-box">
    <div class="trophy">🏆</div>
    <h2 id="winnerName"></h2>
    <p style="color:var(--text2);margin-bottom:20px;">Kazanan!</p>
    <button class="btn gold" onclick="location.reload()">🔄 Tekrar Oyna</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

const DIE_FACES = ['', '⚀','⚁','⚂','⚃','⚄','⚅'];
const COLOR_NAMES = { brown:'#8B4513', lblue:'#87CEEB', pink:'#FF69B4', orange:'#FF8C00', red:'#DC143C', yellow:'#FFD700', green:'#228B22', dblue:'#00008B' };

// ─── STATE ───────────────────────────────────────────────────────
let socket, myId, myRoom, gameState, isHost = false;
let selectedSquareId = null;

// ─── SOCKET SETUP ─────────────────────────────────────────────────
function connectSocket() {
  socket = io();

  socket.on('connect', () => { myId = socket.id; });

  socket.on('gameState', (state) => {
    gameState = state;
    renderAll();
    if (state.state === 'ended' && state.winner) {
      document.getElementById('winnerName').textContent = state.winner;
      document.getElementById('winnerOverlay').classList.add('open');
    }
  });

  socket.on('disconnect', () => showToast('❌ Bağlantı kesildi, yeniden bağlanılıyor...'));
}
connectSocket();

// ─── LOBBY ACTIONS ────────────────────────────────────────────────
function createRoom() {
  const name = document.getElementById('nameInput').value.trim() || 'Oyuncu';
  socket.emit('createRoom', { playerName: name }, (res) => {
    if (res.error) return showToast('❌ ' + res.error);
    myRoom = res.roomId;
    isHost = true;
    showScreen('waiting');
  });
}

function joinRoom() {
  const name = document.getElementById('nameInput').value.trim() || 'Oyuncu';
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!code) return showToast('Oda kodunu gir!');
  socket.emit('joinRoom', { roomId: code, playerName: name }, (res) => {
    if (res.error) return showToast('❌ ' + res.error);
    myRoom = code;
    isHost = false;
    showScreen('waiting');
  });
}

function startGame() {
  socket.emit('startGame', {}, (res) => {
    if (res?.error) showToast('❌ ' + res.error);
  });
}

function leaveGame() {
  socket.disconnect();
  location.reload();
}

// ─── GAME ACTIONS ─────────────────────────────────────────────────
function rollDice() {
  const d1 = document.getElementById('die1');
  const d2 = document.getElementById('die2');
  d1.classList.add('rolling');
  d2.classList.add('rolling');
  setTimeout(() => { d1.classList.remove('rolling'); d2.classList.remove('rolling'); }, 400);
  socket.emit('rollDice', {}, (res) => {
    if (res?.error) showToast('❌ ' + res.error);
  });
}

function declineBuy()   { socket.emit('declineBuy', {}, (r) => { if(r?.error) showToast('❌ '+r.error); }); }
